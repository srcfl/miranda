  :root {
    --ground: #0D1117;
    --surface: #151B23;
    --line: #232D3A;
    --paper: #E8EDF3;
    --muted: #98A4B2;
    --accent: #FF7A45;

    --display: "Familjen Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--ground);
  }

  body {
    font-family: var(--display);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    background: var(--ground);
  }

  /* The only visual device: the card is two stacked planes. The upper one is
     the device in your hand, the lower one the machine, and the seam between
     them is the layer Miranda is. Nothing else is drawn. */
  .plane {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 138px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }

  /* The accent marks the direct path, so it sits on the seam. */
  .seam {
    position: absolute;
    left: 96px;
    bottom: 137px;
    width: 196px;
    height: 3px;
    background: var(--accent);
  }

  .content {
    position: absolute;
    left: 96px;
    top: 70px;
    width: 1088px;
  }

  .wordmark {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.42em;
    color: var(--paper);
  }

  h1 {
    margin-top: 48px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 106px;
    line-height: 1.04;
    letter-spacing: -0.028em;
    color: var(--paper);
  }

  .support {
    margin-top: 34px;
    font-family: var(--display);
    font-weight: 400;
    font-size: 31px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--muted);
  }

  .proof {
    position: absolute;
    left: 96px;
    bottom: 60px;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.005em;
    color: var(--muted);
    white-space: nowrap;
  }
  .proof b { font-weight: 500; color: var(--accent); }
  .proof span { color: #4C5A6B; padding: 0 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="plane"></div>
    <div class="seam"></div>

    <div class="content">
      <div class="wordmark">MIRANDA</div>
      <h1>Leave your desk.<br>Keep your terminal.</h1>
      <p class="support">The reach layer for persistent terminals.</p>
    </div>

    <div class="proof"><b>12&#8239;ms on a LAN</b> <span>&middot;</span> end-to-end encrypted <span>&middot;</span> no VPN, no SSH keys</div>
  </div>
</body>
</html>
